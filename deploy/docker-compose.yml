# Shared, Google-SSO-gated deployment of Ledger + Homebase on one domain.
# See README.md in this directory for the full plan and setup runbook.
#
# Expects the two repos checked out side by side:
#   <parent>/ledger_finance   (this repo; run `docker compose` from ./deploy)
#   <parent>/homebase         (override with HOMEBASE_REPO)
#
# Isolation model: each app sits on its own network shared only with Caddy, and
# mounts only its own data directory. No app publishes a port — Caddy is the only
# way in, and it is the only thing that can add the gateway secret header.
name: home-apps

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
      LEDGER_PROXY_SECRET: ${LEDGER_PROXY_SECRET:?set LEDGER_PROXY_SECRET in .env}
      HOMEBASE_PROXY_SECRET: ${HOMEBASE_PROXY_SECRET:?set HOMEBASE_PROXY_SECRET in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge, ledger_net, homebase_net]
    depends_on: [oauth2-proxy, ledger, homebase]

  oauth2-proxy:
    # Pinned on purpose — check https://github.com/oauth2-proxy/oauth2-proxy/releases and bump deliberately.
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    restart: unless-stopped
    environment:
      OAUTH2_PROXY_PROVIDER: google
      OAUTH2_PROXY_CLIENT_ID: ${OAUTH2_PROXY_CLIENT_ID:?set in .env}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET:?set in .env}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET:?set in .env}
      # The allowlist. Do NOT also set OAUTH2_PROXY_EMAIL_DOMAINS: an email passes if it
      # is in this file OR matches a domain, so email_domains=* would admit every Google account.
      OAUTH2_PROXY_AUTHENTICATED_EMAILS_FILE: /etc/oauth2-proxy/allowed_emails.txt
      # One sign-in covers every <app>.${DOMAIN} subdomain.
      OAUTH2_PROXY_COOKIE_DOMAINS: .${DOMAIN}
      OAUTH2_PROXY_WHITELIST_DOMAINS: .${DOMAIN}
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
      OAUTH2_PROXY_COOKIE_EXPIRE: 168h
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_UPSTREAMS: static://202
    volumes:
      - ./oauth2-proxy/allowed_emails.txt:/etc/oauth2-proxy/allowed_emails.txt:ro
    networks: [edge]

  ledger:
    build: ..
    restart: unless-stopped
    environment:
      FLASK_ENV: production
      SECRET_KEY: ${LEDGER_SECRET_KEY:?set in .env}
      AUTH_MODE: proxy
      AUTH_PROXY_SECRET: ${LEDGER_PROXY_SECRET:?set in .env}
      ALLOWED_EMAILS: ${LEDGER_ALLOWED_EMAILS:?set in .env}
    volumes:
      - ${LEDGER_DATA_DIR:-../data}:/app/data
      - ${LEDGER_LOG_DIR:-../logs}:/app/logs
    networks: [ledger_net]

  homebase:
    build: ${HOMEBASE_REPO:-../../homebase}
    restart: unless-stopped
    environment:
      FLASK_APP: run.py
      FLASK_ENV: production
      SECRET_KEY: ${HOMEBASE_SECRET_KEY:?set in .env}
      AUTH_MODE: proxy
      AUTH_PROXY_SECRET: ${HOMEBASE_PROXY_SECRET:?set in .env}
    volumes:
      - ${HOMEBASE_DATA_DIR:-../../homebase/data}:/app/data
      - ${HOMEBASE_LOG_DIR:-../../homebase/logs}:/app/logs
    networks: [homebase_net]

networks:
  edge:
  ledger_net:
  homebase_net:

volumes:
  caddy_data:
  caddy_config:
